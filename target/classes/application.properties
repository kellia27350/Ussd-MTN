# Server
server.port=8082

# Application name
spring.application.name=product-catalogue


spring.datasource.url=jdbc:postgresql://localhost:5432/product_catalogue
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=123

# JPA / Hibernate
# ddl-auto=update -> Hibernate creates/updates the tables automatically
# from the entity classes. No manual SQL needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pretty-print JSON responses (indented, one field per line)
spring.jackson.serialization.indent_output=true

# false = do NOT auto-create sample categories/products at startup
app.seed.enabled=false


# USSD: seconds of inactivity before a session expires (default 180). Use ~20 when testing expiry.
app.ussd.session-ttl-seconds=180
